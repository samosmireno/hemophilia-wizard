name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci # respects the committed lockfile — reproducible
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build # tsc -b (type-check) + vite build
      - run: npm test # vitest run
